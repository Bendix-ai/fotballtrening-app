appId: com.bendixen.fotballtrening
name: "Admin Store Download Flow"
---
# Login as test admin
- runFlow: helpers/login-as-admin.yaml

# Open drawer by tapping hamburger menu
- tapOn:
    id: "admin-menu-button"
- waitForAnimationToEnd

# Navigate to Exercise Store via drawer
- tapOn:
    id: "drawer-store"

# Verify store screen loaded
- assertVisible:
    text: ".*Butikk.*"

# Tap on first store exercise
- tapOn:
    index: 0
    id: "store-exercise-card"

# Verify store exercise detail screen
- assertVisible:
    id: "store-download-button"

# Download exercise to club
- tapOn:
    id: "store-download-button"

# Verify success toast or confirmation
- assertVisible:
    text: ".*lastet ned.*|.*lagt til.*"

# Go back to store
- back
