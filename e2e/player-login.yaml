appId: com.bendixen.fotballtrening
name: "Player Login Flow"
---
# Prerequisite: onboarding completed, not logged in

# Launch app and wait for login screen
- runFlow: helpers/launch-to-login.yaml

# Ensure player tab is selected (default)
- tapOn: "Spiller"

# Select club from dropdown (Våganes FK has year groups and test users)
- tapOn:
    id: "login-club-dropdown"
- extendedWaitUntil:
    visible:
        text: "Velg klubb"
    timeout: 5000
- tapOn: "Våganes FK"

# Wait for year groups to load after club selection
- extendedWaitUntil:
    visible:
        id: "login-year-dropdown"
    timeout: 10000

# Select year group
- tapOn:
    id: "login-year-dropdown"
- extendedWaitUntil:
    visible:
        text: "Velg årgang"
    timeout: 5000
- tapOn: "2016"

# Wait for gender dropdown to be populated (async loadTeams after year selection)
- extendedWaitUntil:
    visible:
        id: "login-gender-dropdown"
    timeout: 15000

# Select gender - open dropdown, tap option by testID
- tapOn:
    id: "login-gender-dropdown"
- extendedWaitUntil:
    visible:
        text: "Gutter"
    timeout: 10000
- tapOn:
    id: "login-gender-dropdown-option-boys"
- waitForAnimationToEnd

# Scroll input fields into view (two swipes to push dropdowns off-screen)
- swipe:
    direction: UP
    duration: 500
- swipe:
    direction: UP
    duration: 500

# Enter username
- tapOn:
    id: "login-username"
- inputText: "e2etester"

# Dismiss keyboard by tapping a non-interactive label on the form
- tapOn: "Velg kjønn"
- waitForAnimationToEnd

# Enter password
- tapOn:
    id: "login-password"
- inputText: "Test1234!"

# Dismiss keyboard by tapping a non-interactive label
- tapOn: "Brukernavn"
- waitForAnimationToEnd

# Scroll to login button if needed and tap
- scrollUntilVisible:
    element:
        text: "Logg inn"
    direction: DOWN
    timeout: 5000
- tapOn: "Logg inn"

# Dismiss iOS "Save Password?" dialog if it appears
- runFlow:
    when:
        visible: "Not Now"
    commands:
        - tapOn: "Not Now"

# Wait for login to complete - should show home screen or error
- extendedWaitUntil:
    visible:
        text: ".*Hjem.*|.*Hei.*|.*feil.*|.*Ugyldig.*"
    timeout: 15000
