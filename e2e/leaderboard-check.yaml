appId: com.fotballtrening.app
name: "Leaderboard Check Flow"
---
# Prerequisite: User must be logged in as a player
# Navigate to leaderboard tab
- tapOn:
    id: "tab-leaderboard"

# Verify leaderboard screen loaded
- assertVisible:
    text: "Toppliste"
    timeout: 5000

# Verify scope filter chips are visible
- assertVisible: "Klubb"
- assertVisible: "Lag"

# Verify period filter buttons are visible
- assertVisible: "Denne uken"
- assertVisible: "Denne måneden"
- assertVisible: "Totalt"

# Switch to weekly view
- tapOn: "Denne uken"

# Switch to monthly view
- tapOn: "Denne måneden"

# Switch to all-time view
- tapOn: "Totalt"

# Verify podium is visible (at least one player name should appear)
- assertVisible:
    text: ".*"
    timeout: 3000

# Switch scope to team
- tapOn: "Lag"

# Wait for data refresh
- waitForAnimationToEnd

# Switch back to club scope
- tapOn: "Klubb"
