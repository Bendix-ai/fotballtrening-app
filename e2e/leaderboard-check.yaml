appId: com.bendixen.fotballtrening
name: "Leaderboard Check Flow"
---
# Login as test player
- runFlow: helpers/login-as-player.yaml

# Dismiss Expo debug banner by tapping its X button (circle-X at right side of banner)
- tapOn:
    point: "93%, 94%"
- waitForAnimationToEnd

# Navigate to leaderboard tab (3rd of 4 tabs)
- tapOn: "Toppliste"

# Verify leaderboard screen loaded
- assertVisible:
    text: "Toppliste"

# Verify scope filter chips are visible
- assertVisible: "Klubb"
- assertVisible: "Lag"

# Verify period filter buttons are visible
- assertVisible: "Denne uken"
- assertVisible: "Denne måneden"
- assertVisible: "Totalt"

# Switch to weekly view
- tapOn: "Denne uken"

# Switch to monthly view
- tapOn: "Denne måneden"

# Switch to all-time view
- tapOn: "Totalt"

# Verify podium is visible (at least one player name should appear)
- assertVisible:
    text: ".*"

# Switch scope to team
- tapOn: "Lag"

# Wait for data refresh
- waitForAnimationToEnd

# Switch back to club scope
- tapOn: "Klubb"
