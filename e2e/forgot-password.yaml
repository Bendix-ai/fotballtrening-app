appId: com.bendixen.fotballtrening
name: "Forgot Password Flow"
---
# Prerequisite: onboarding completed, not logged in

# Launch app and wait for login screen
- runFlow: helpers/launch-to-login.yaml

# Switch to admin mode to see forgot password link
- tapOn: "Admin"

# Tap forgot password link
- tapOn: "Glemt passord?"

# Verify forgot password screen loaded
- assertVisible:
    text: ".*Tilbakestill passord.*"

# Enter email
- tapOn:
    id: "forgot-email-input"
- inputText: "admin@test.no"

# Tap send reset link button
- tapOn:
    id: "forgot-send-button"

# Verify response - screen still shows (no crash), either success or network error
- assertVisible:
    text: ".*Tilbakestill passord.*"

# Navigate back to login
- tapOn: "Tilbake til innlogging"

# Verify back on login screen
- assertVisible: "Spiller"
