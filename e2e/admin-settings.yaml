appId: com.bendixen.fotballtrening
name: "Admin Settings Screen"
---
# Login as test admin
- runFlow: helpers/login-as-admin.yaml

# Navigate to Admin Settings via drawer
- tapOn:
    id: "drawer-settings"

# Verify settings screen loaded
- assertVisible:
    text: ".*Innstillinger.*"

# Verify profile section is visible
- assertVisible:
    text: ".*Profil.*|.*Admin.*"

# Verify theme section
- assertVisible:
    text: ".*Lyst.*|.*Mørkt.*"

# Toggle dark theme
- tapOn:
    text: ".*Mørkt.*"

# Toggle back to light
- tapOn:
    text: ".*Lyst.*"

# Verify logout button exists
- assertVisible:
    text: ".*Logg ut.*"
