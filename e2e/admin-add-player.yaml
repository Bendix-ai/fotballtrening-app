appId: com.bendixen.fotballtrening
name: "Admin Add Player Flow"
---
# Login as test admin
- runFlow: helpers/login-as-admin.yaml

# Verify admin dashboard loaded
- assertVisible:
    text: "Dashboard"

# Open drawer by tapping hamburger menu
- tapOn:
    id: "admin-menu-button"
- waitForAnimationToEnd

# Navigate to Players management via drawer
- tapOn:
    id: "drawer-players"

# Verify players list loaded
- assertVisible:
    text: "Spillere"

# Tap add player button (FAB)
- tapOn:
    id: "add-player-fab"

# Verify add player form loaded
- assertVisible:
    text: ".*spiller.*"

# Fill in player details
- tapOn:
    id: "player-name-input"
- inputText: "Test Spiller E2E"

- tapOn:
    id: "player-username-input"
- inputText: "e2etester"

- tapOn:
    id: "player-password-input"
- inputText: "Test1234!"

# Select year group if dropdown exists
- tapOn:
    id: "player-year-dropdown"
- tapOn: "2015"

# Select gender if dropdown exists
- tapOn:
    id: "player-gender-dropdown"
- tapOn: "Gutter"

# Save player
- tapOn:
    id: "save-player-button"

# Verify success (back on players list with new player visible)
- assertVisible:
    text: "Test Spiller E2E"
