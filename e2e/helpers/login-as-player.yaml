appId: com.bendixen.fotballtrening
name: "Helper: Login as test player"
---
# Launch app and wait for login screen
- runFlow: launch-to-login.yaml

# Ensure player tab is selected
- tapOn: "Spiller"

# Select club
- tapOn:
    id: "login-club-dropdown"
- extendedWaitUntil:
    visible:
        text: "Velg klubb"
    timeout: 5000
- tapOn: "Våganes FK"

# Select year
- extendedWaitUntil:
    visible:
        id: "login-year-dropdown"
    timeout: 10000
- tapOn:
    id: "login-year-dropdown"
- extendedWaitUntil:
    visible:
        text: "Velg årgang"
    timeout: 5000
- tapOn: "2016"

# Select gender - open dropdown, coordinate tap option, dismiss overlay
- extendedWaitUntil:
    visible:
        id: "login-gender-dropdown"
    timeout: 15000
- tapOn:
    id: "login-gender-dropdown"
- extendedWaitUntil:
    visible:
        text: "Gutter"
    timeout: 10000
- tapOn:
    point: "30%, 52%"
- tapOn:
    point: "50%, 10%"
- waitForAnimationToEnd

# Scroll input fields into view
- swipe:
    direction: UP
    duration: 500
- swipe:
    direction: UP
    duration: 500

# Enter username
- tapOn:
    id: "login-username"
- inputText: "e2etester"

# Dismiss keyboard by tapping non-interactive label
- tapOn: "Velg kjønn"
- waitForAnimationToEnd

# Enter password
- tapOn:
    id: "login-password"
- inputText: "Test1234!"

# Dismiss keyboard by tapping non-interactive label
- tapOn: "Brukernavn"
- waitForAnimationToEnd

# Login
- scrollUntilVisible:
    element:
        text: "Logg inn"
    direction: DOWN
    timeout: 5000
- tapOn: "Logg inn"

# Dismiss iOS "Save Password?" dialog if it appears
- runFlow:
    when:
        visible: "Not Now"
    commands:
        - tapOn: "Not Now"

# Wait for home screen
- extendedWaitUntil:
    visible:
        id: "tab-home"
    timeout: 15000

# Dismiss debug warning banner (native overlay — always tap X at bottom right)
- tapOn:
    point: "95%, 97%"
- waitForAnimationToEnd
