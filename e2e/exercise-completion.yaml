appId: com.bendixen.fotballtrening
name: "Exercise Completion Flow"
---
# Login as test player
- runFlow: helpers/login-as-player.yaml

# Navigate to exercises via "Se alle" link on home screen (avoids tab bar which
# is blocked by Expo debug banner in dev builds)
- scrollUntilVisible:
    element:
        text: "Se alle"
    direction: DOWN
    timeout: 5000
- tapOn: "Se alle"

# Wait for exercise list to load
- extendedWaitUntil:
    visible:
        id: "exercise-card"
    timeout: 10000

# Tap on first exercise card
- tapOn:
    index: 0
    id: "exercise-card"

# Verify exercise detail screen
- assertVisible:
    id: "exercise-start-button"

# Start the exercise
- tapOn:
    id: "exercise-start-button"

# Verify execution screen loaded (timer should be visible)
- assertVisible:
    id: "exercise-timer"

# Wait for exercise timer to complete (exercises range 120–300s, add buffer)
- extendedWaitUntil:
    visible:
        id: "exercise-complete-button"
    timeout: 360000

# Tap complete button
- tapOn:
    id: "exercise-complete-button"

# Verify completion screen
- assertVisible:
    text: ".*poeng.*"

# Go back to exercises list
- tapOn:
    id: "exercise-back-button"

# Verify we're back on exercises list
- assertVisible:
    text: ".*[Øø]velser.*"
