name: Build & Submit to TestFlight

on:
  push:
    branches: [main]

jobs:
  build-and-submit:
    name: iOS Production Build + TestFlight
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build iOS production and submit to TestFlight
        run: eas build --platform ios --profile production --non-interactive --auto-submit
